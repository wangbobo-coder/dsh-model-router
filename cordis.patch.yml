# dsh-model-router bundle patch.
#
# Inserts one Host plugin row. Everything tunable lives in its `config:` block —
# edit this file (or the plugin's settings entry) rather than the source.
# The row is id-addressable as `model-router` from a later patch layer.
#
# 2026-10-23: this row is disabled in the profile's cordis.patch.yml
# (`- id: model-router` / `disabled: true`). DSH's web_search/web_fetch are
# host-side tools that already work with the local model, so routing is not
# required for research. Keep the code; re-enable if you want cloud-model
# quality upgrades, cost control, or subagent-based research.
- insert:
    - id: model-router
      name: '@local/dsh-model-router'
      config:
        enabled: true
        # auto = 按意图自动判定；local / cloud = 全部强制走某一边
        mode: auto
        # 本地路由：留空 = 不干预，沿用你在 UI 里选中的模型
        localProvider: ''
        localModel: ''
        # 云端路由：auto = 自动从已注册路由里挑 deepseek-account / deepseek-official
        cloudProvider: auto
        # 官方目录里带 1017 徽标的 DeepSeek-V4.1-Flash（provider deepseek-account）
        cloudModel: deepseek-flash
        # 切到云端时是否沿用 temperature / maxTokens / reasoningEffort
        keepControlsOnSwitch: false
        # 云端失败（未登录 / 无凭据 / 配额）后降级回本地并冷却
        fallbackToLocalOnCloudFailure: true
        cloudCooldownMs: 600000
        # 云端黏住多少个 turn
        stickyTurns: 1
        # 调研执行方式：subagent = 开云端子智能体去查，主会话留本地；
        # inline = 主会话自己切到云端
        researchMode: subagent
        # 子智能体 provider，取自已注册的 provider（spawn = 本进程内跑）
        researchSubagentProvider: spawn
        # 子智能体超时（毫秒）：超时放弃本次调研，主会话照常本地继续
        researchTimeoutMs: 180000
        # 子智能体可再往下委派的最大深度（1 = 不允许孙智能体）
        researchMaxDepth: 1
        # 自定义子智能体提示词，{question} 替换成请求原文；留空用内置模板
        researchPrompt: ''
        logRouting: true
        # 命中即判定「这一轮需要联网」
        researchKeywords:
          - 联网
          - 上网
          - 搜索
          - 搜一下
          - 查一下
          - 查询
          - 检索
          - 调研
          - 研究一下
          - 最新
          - 近期
          - 新闻
          - 资讯
          - 官网
          - 文档链接
          - 网址
          - 引用来源
          - 出处
          - 研究报告
          - 评测
          - 对比一下
          - 实时
          - search
          - web search
          - look up
          - lookup
          - research
          - browse
          - crawl
          - latest
          - recent
          - news
          - release notes
          - changelog
          - official docs
          - google
          - bing
          - duckduckgo
          - arxiv
          - github issue
          - stackoverflow
        # 本 turn 调用过这些工具就留在云端（支持结尾 * 通配）
        researchTools:
          - web_search
          - web_fetch
          - x_search
          - read_page
          - mcp__*
